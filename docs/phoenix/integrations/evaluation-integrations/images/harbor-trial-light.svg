<svg xmlns="http://www.w3.org/2000/svg" aria-label="How a Harbor trial runs" preserveAspectRatio="xMidYMid meet" role="img" viewBox="24 44 1152 460"><style>:root{--paper:#ffffff;--node:#f4f4f5;--ink:#18181b;--muted:#52525b;--soft:#71717a;--rule:rgba(0,0,0,.14);--accent:#0080b3;--accent-tint:rgba(0,128,179,.10);--accent-zone:rgba(0,128,179,.04);--accent-line:rgba(0,128,179,.6);--store:rgba(0,0,0,.035);--ext-line:rgba(0,0,0,.3);--fs:system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;--fm:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.bg,.bgmask,.mask{fill:var(--paper)}.box{stroke-width:1}.box.n{fill:var(--node);stroke:var(--soft)}.box.f{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}.box.s{fill:var(--store)}.zone{fill:var(--accent-zone);stroke:var(--accent-line);stroke-dasharray:4 4}.box.s,.wire{stroke:var(--muted)}.wire{fill:none;stroke-width:1.2}.wire.wire-a{stroke:var(--accent)}.mk{fill:var(--muted)}.alab.a,.mk-a,.tag.a{fill:var(--accent)}text{fill:var(--ink)}.name{font:600 17px var(--fs)}.sub{fill:var(--muted)}.code,.sub{font:400 13px var(--fm)}.tag{font:500 12px var(--fm);letter-spacing:.14em;fill:var(--soft)}.alab{font:400 12px var(--fm);letter-spacing:.06em;fill:var(--muted)}.code,.sub{font-size:15px}.alab,.tag{font-size:14px}.name{font-size:20px}</style><rect width="1152" height="460" x="24" y="44" class="bg"/><defs><marker id="harbor-trial-arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon points="0 0 8 3 0 6" class="mk"/></marker><marker id="harbor-trial-arrow-accent" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon points="0 0 8 3 0 6" class="mk-a"/></marker></defs><rect width="1200" height="592" class="bg"/><g><rect width="216" height="248" x="40" y="172" class="bgmask" rx="6"/><rect width="216" height="248" x="40" y="172" class="box s" rx="6"/><text x="56" y="200" class="tag">TASK</text><text x="56" y="226" class="name">Task directory</text><rect width="184" height="40" x="56" y="244" class="box n" rx="4"/><text x="72" y="269" class="code">environment/</text><rect width="184" height="40" x="56" y="300" class="box n" rx="4"/><text x="72" y="325" class="code">instruction.md</text><g class="sub-item"><rect width="184" height="40" x="56" y="356" class="bgmask" rx="4"/><rect width="184" height="40" x="56" y="356" class="box f" rx="4"/><text x="72" y="381" class="code">tests/</text></g></g><g><rect width="600" height="392" x="360" y="56" class="zone" rx="8"/><text x="384" y="84" class="tag a">PER-TRIAL SANDBOX CONTAINER</text><path marker-end="url(#harbor-trial-arrow)" d="M240 264 H356" class="wire"/><rect width="60" height="16" x="278" y="240" class="mask" rx="2"/><text x="308" y="252" class="alab" text-anchor="middle">BUILDS</text></g><g><path marker-end="url(#harbor-trial-arrow)" d="M240 320 H396" class="wire"/><rect width="68" height="16" x="274" y="296" class="mask" rx="2"/><text x="308" y="308" class="alab" text-anchor="middle">READ BY</text><path marker-end="url(#harbor-trial-arrow)" d="M520 296 V228" class="wire"/><rect width="68" height="16" x="528" y="252" class="mask" rx="2"/><text x="536" y="264" class="alab">CHANGES</text><rect width="520" height="112" x="400" y="112" class="bgmask" rx="6"/><rect width="520" height="112" x="400" y="112" class="box s" rx="6"/><text x="416" y="140" class="tag">WORKSPACE</text><text x="416" y="166" class="name">Sandbox filesystem</text><text x="416" y="188" class="sub">code, files and services for the agent to work with</text><rect width="240" height="120" x="400" y="296" class="box n" rx="6"/><text x="416" y="324" class="tag">RUNS FIRST</text><text x="416" y="350" class="name">Agent</text><text x="416" y="372" class="sub">any harness + model</text><text x="416" y="390" class="sub">reads instruction.md</text></g><g><path marker-end="url(#harbor-trial-arrow-accent)" d="M240 376 L300 376 Q308 376 308 384 L308 480 Q308 488 316 488 L792 488 Q800 488 800 480 L800 420" class="wire wire-a"/><rect width="236" height="20" x="442" y="462" class="mask" rx="2"/><text x="560" y="476" class="alab a" text-anchor="middle">INSERTED AFTER AGENT RUNS</text></g><g><path marker-end="url(#harbor-trial-arrow-accent)" d="M800 224 V292" class="wire wire-a"/><rect width="112" height="16" x="808" y="252" class="mask" rx="2"/><text x="816" y="264" class="alab a">INSPECTED BY</text><rect width="240" height="120" x="680" y="296" class="bgmask" rx="6"/><rect width="240" height="120" x="680" y="296" class="box f" rx="6"/><text x="696" y="324" class="tag a">RUNS SECOND</text><text x="696" y="350" class="name">Verifier</text><text x="696" y="372" class="sub">runs tests/test.sh</text><text x="696" y="390" class="sub">sees the full sandbox</text></g><g><path marker-end="url(#harbor-trial-arrow-accent)" d="M920 356 H996" class="wire wire-a"/><rect width="160" height="120" x="1000" y="296" class="bgmask" rx="6"/><rect width="160" height="120" x="1000" y="296" class="box f" rx="6"/><text x="1016" y="324" class="tag a">RESULT</text><text x="1016" y="350" class="name">Rewards</text><text x="1016" y="372" class="sub">reward.json</text><text x="1016" y="390" class="sub">1 or more keys</text></g></svg>