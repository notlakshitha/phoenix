<svg xmlns="http://www.w3.org/2000/svg" aria-label="How the Phoenix plugin maps Harbor to Phoenix" preserveAspectRatio="xMidYMid meet" role="img" viewBox="-6 0 1212 438"><style>:root{--paper:#ffffff;--node:#f4f4f5;--ink:#18181b;--muted:#52525b;--soft:#71717a;--rule:rgba(0,0,0,.14);--accent:#0080b3;--accent-tint:rgba(0,128,179,.10);--accent-zone:rgba(0,128,179,.04);--accent-line:rgba(0,128,179,.6);--store:rgba(0,0,0,.035);--ext-line:rgba(0,0,0,.3);--fs:system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;--fm:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.bg{fill:var(--paper)}.box{stroke-width:1}.box.n{fill:var(--node);stroke:var(--soft)}.box.f,.wire{stroke-width:1.2}.box.f{fill:var(--accent-tint)}.guide,.wire{fill:none}.wire{stroke:var(--muted)}.box.f,.wire.wire-a{stroke:var(--accent)}.guide{stroke:var(--soft)}.mk{fill:var(--muted)}.mk-a{fill:var(--accent)}text{fill:var(--ink)}.name{font:600 17px var(--fs)}.mname{font:500 16px var(--fm)}.sub{font:400 13px var(--fm);fill:var(--muted)}.tag{font:500 12px var(--fm);letter-spacing:.14em;fill:var(--soft)}.acc,.tag.a{fill:var(--accent)}.name{font-size:22px}.sub{font-size:16px}.tag{font-size:14px}.mname{font-size:21px}</style><rect width="1212" height="438" x="-6" y="0" class="bg"/><defs><marker id="a" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon points="0 0 8 3 0 6" class="mk"/></marker><marker id="b" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon points="0 0 8 3 0 6" class="mk-a"/></marker></defs><text x="0" y="18" class="tag">HARBOR</text><text x="0" y="274" class="tag a">PHOENIX</text><rect width="1200" height="60" x="0" y="172" class="box n" rx="8"/><text x="600" y="210" class="mname acc" text-anchor="middle">--plugin arize-phoenix</text><g><rect width="216" height="96" x="0" y="34" class="box n" rx="6"/><text x="20" y="76" class="name">Tasks</text><text x="20" y="106" class="sub">a folder per task</text><path marker-end="url(#a)" d="M108 130 V168" class="wire"/><path marker-end="url(#b)" d="M108 232 V286" class="wire wire-a"/><rect width="216" height="96" x="0" y="290" class="box f" rx="6"/><text x="20" y="332" class="name">Dataset</text><text x="20" y="362" class="sub">versioned examples</text></g><g><rect width="216" height="96" x="246" y="34" class="box n" rx="6"/><text x="266" y="76" class="name">Agent configs</text><text x="266" y="106" class="sub">agent + model</text><path marker-end="url(#a)" d="M354 130 V168" class="wire"/><path marker-end="url(#b)" d="M354 232 V286" class="wire wire-a"/><rect width="216" height="96" x="246" y="290" class="box f" rx="6"/><text x="266" y="332" class="name">Experiments</text><text x="266" y="362" class="sub">one per config</text></g><g><rect width="216" height="96" x="492" y="34" class="box n" rx="6"/><text x="512" y="76" class="name">Trials</text><text x="512" y="106" class="sub">one sandbox each</text><path marker-end="url(#a)" d="M600 130 V168" class="wire"/><path marker-end="url(#b)" d="M600 232 V286" class="wire wire-a"/><rect width="216" height="96" x="492" y="290" class="box f" rx="6"/><text x="512" y="332" class="name">Experiment runs</text><text x="512" y="362" class="sub">one per attempt</text></g><g><rect width="216" height="96" x="738" y="34" class="box n" rx="6"/><text x="758" y="76" class="name">Rewards</text><text x="758" y="106" class="sub">reward.json</text><path marker-end="url(#a)" d="M846 130 V168" class="wire"/><path marker-end="url(#b)" d="M846 232 V286" class="wire wire-a"/><rect width="216" height="96" x="738" y="290" class="box f" rx="6"/><text x="758" y="332" class="name">Annotations</text><text x="758" y="362" class="sub">plus infra_ok</text></g><g><rect width="216" height="96" x="984" y="34" class="box n" rx="6"/><text x="1004" y="76" class="name">Trajectories</text><text x="1004" y="106" class="sub">ATIF steps</text><path marker-end="url(#a)" d="M1092 130 V168" class="wire"/><path marker-end="url(#b)" d="M1092 232 V286" class="wire wire-a"/><rect width="216" height="96" x="984" y="290" class="box f" rx="6"/><text x="1004" y="332" class="name">Traces</text><text x="1004" y="362" class="sub">linked to each run</text></g><g><path d="M4 398 V406 H458 V398" class="guide"/><text x="231" y="428" class="tag" text-anchor="middle">AT JOB START</text></g><g><path d="M496 398 V406 H1196 V398" class="guide"/><text x="846" y="428" class="tag" text-anchor="middle">AS EACH TRIAL ENDS</text></g></svg>